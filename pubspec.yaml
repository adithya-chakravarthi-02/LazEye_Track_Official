name: smart_glasses_app
description: "LazEye Track - A Smart Glasses monitoring app for Amblyopia therapy compliance using MQTT & positive reinforcement video playback."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.0.0
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/therapy.mp4
